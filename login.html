<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obita · Login</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#1f5cff,#0c2f8f);color:#1f2937;}
  .card{background:#fff;border-radius:20px;padding:48px 44px;width:420px;box-shadow:0 30px 70px rgba(0,0,0,.30);}
  .logo{font-size:38px;font-weight:800;color:#2f6bff;letter-spacing:.5px;margin-bottom:6px;}
  .sub{color:#8a93a3;font-size:14px;margin-bottom:32px;}
  label{display:block;font-size:13px;font-weight:600;color:#52606d;margin-bottom:8px;}
  input{width:100%;padding:14px 16px;border:1.5px solid #e3e8f0;border-radius:10px;font-size:15px;outline:none;}
  input:focus{border-color:#2f6bff;}
  .err{color:#ff5b6a;font-size:12.5px;margin-top:8px;min-height:16px;}
  .btn{margin-top:20px;width:100%;background:#2f6bff;color:#fff;border:none;padding:14px;border-radius:10px;
    font-size:15px;font-weight:700;cursor:pointer;}
  .btn:hover{background:#1f51d6;}
  .hint{margin-top:22px;font-size:12px;color:#9aa3b2;text-align:center;line-height:1.6;}
  .hint b{color:#52606d;}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">Obita</div>
    <div class="sub">Sign in to your account</div>
    <form onsubmit="return doLogin(event)">
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="you@example.com" autocomplete="email" required>
      <div class="err" id="err"></div>
      <button class="btn" type="submit">Continue</button>
    </form>
  </div>

<script>
  const ALLOWED=["obita.xyz","starleaper.xyz"];
  function doLogin(e){
    e.preventDefault();
    const email=document.getElementById("email").value.trim().toLowerCase();
    const err=document.getElementById("err");
    const ok=/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email);
    const domain=email.split("@")[1];
    if(!ok){ err.textContent="请输入有效的邮箱地址"; return false; }
    if(!ALLOWED.includes(domain)){
      err.textContent="该邮箱无登录权限"; return false;
    }
    sessionStorage.setItem("obitaUser",email);
    window.location.href="checkout.html";
    return false;
  }
</script>
</body>
</html>
